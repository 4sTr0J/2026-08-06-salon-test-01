server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index admin.html index.html index.htm;
        try_files $uri $uri/ /admin.html =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

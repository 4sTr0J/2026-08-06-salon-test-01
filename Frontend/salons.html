<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StylePulse - Registered Salons</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS styles -->
    <link rel="stylesheet" href="index.css?v=60">
    
    <style>
        .salons-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 120px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-inline: 2rem;
            z-index: 10;
            position: relative;
        }

        .salons-header {
            margin-bottom: 3rem;
            animation: slideUp 0.8s ease-out;
        }

        .salons-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .salons-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        /* Salons Cards Grid */
        .salons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            animation: slideUp 1s ease-out;
            margin-bottom: 4rem;
        }

        .salon-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            min-height: 240px;
        }

        .salon-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--gold-glow);
            border-color: #ffcc00;
        }

        .salon-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .salon-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .rating-badge {
            background: rgba(255, 184, 43, 0.15);
            border: 1px solid rgba(255, 184, 43, 0.4);
            color: #ffcc00;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .salon-details {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .salon-address {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .salon-web-link {
            color: #ffcc00;
            text-decoration: none;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .salon-web-link:hover {
            text-decoration: underline;
        }

        .select-salon-btn {
            background: var(--accent-gradient);
            color: #000000;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            margin-top: 1rem;
        }

        .select-salon-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .empty-salons {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px dashed rgba(255, 184, 43, 0.3);
            border-radius: 16px;
            color: var(--text-secondary);
            font-style: italic;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ambient Glow Backgrounds */
        .auth-bg-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffaa00 0%, transparent 70%);
            top: -150px;
            left: -150px;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="auth-bg-ambient">
        <div class="bg-glow-orb orb-1"></div>
        <div class="bg-glow-orb orb-2"></div>
    </div>

    <!-- Fixed Top Navigation Header -->
    <header class="navbar" id="main-header" style="background: rgba(8, 6, 5, 0.95); border-bottom: 1px solid rgba(255, 184, 43, 0.3); position: fixed; width: 100%;">
        <div class="nav-left">
            <a href="index.html" class="nav-logo">
                <img src="component/logo.png" alt="StylePulse Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="salons.html" class="nav-link active">EXPLORE SALONS</a>
                <a href="dashboard.html" class="nav-link">MY DASHBOARD</a>
            </nav>
        </div>
        <div class="nav-right">
            <div style="color: var(--text-secondary); margin-right: 1.5rem; font-size: 0.9rem;" id="user-email-display"></div>
            <button id="logout-btn" class="nav-login" style="border: none; cursor: pointer; background: transparent; font-family: 'Poppins', sans-serif; color: #ffffff;">LOG OUT</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="salons-container">
        <div class="salons-header">
            <h1 class="salons-title">Top Rated Salons</h1>
            <p class="salons-subtitle">Book exclusive luxury experiences from our registered & approved salon partners.</p>
        </div>

        <!-- Grid of Salons -->
        <div class="salons-grid" id="salons-list-container">
            <div class="empty-salons">Loading registered salons...</div>
        </div>
    </div>

    <!-- Alert Box Notification -->
    <div id="alert-box" class="alert-box">
        <div class="alert-content">
            <span id="alert-icon" class="alert-icon"></span>
            <span id="alert-message" class="alert-message"></span>
        </div>
    </div>
    
    <style>
        .alert-box {
            position: fixed; top: 20px; right: -400px;
            background: rgba(12, 11, 8, 0.95); border-left: 4px solid;
            padding: 16px 24px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999; backdrop-filter: blur(10px);
            display: flex; align-items: center;
        }
        .alert-box.show { right: 20px; }
        .alert-box.success { border-color: #2ecc71; }
        .alert-box.error { border-color: #e74c3c; }
        .alert-content { display: flex; align-items: center; gap: 12px; }
        .alert-message { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 500; color: #fff; }
    </style>

    <!-- Frontend logic to fetch and display salons -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("stylepulse_token");
            const userString = localStorage.getItem("stylepulse_user");
            let user = null;

            if (userString) {
                try { user = JSON.parse(userString); } catch (e) { user = null; }
            }

            if (!token || !user) {
                window.location.href = "login.html";
                return;
            }

            // Set profile details
            document.getElementById("user-email-display").textContent = user.email.toUpperCase();

            // Logout
            const logoutBtn = document.getElementById("logout-btn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem("stylepulse_token");
                    localStorage.removeItem("stylepulse_user");
                    window.location.href = "login.html";
                });
            }

            // Fetch Approved Salons from Backend
            const container = document.getElementById("salons-list-container");
            try {
                const res = await fetch("http://localhost:5000/api/auth/salons", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success && data.salons) {
                    renderSalons(data.salons);
                } else {
                    container.innerHTML = `<div class="empty-salons">Failed to load salons list.</div>`;
                }
            } catch (err) {
                console.error("Salons load error:", err);
                container.innerHTML = `<div class="empty-salons">Server connection error. Please try again.</div>`;
            }

            function renderSalons(salons) {
                if (salons.length === 0) {
                    container.innerHTML = `<div class="empty-salons">No approved salons available at the moment.</div>`;
                    return;
                }

                // Generates random rating between 4.6 and 4.9 for visual aesthetics
                const getMockRating = () => (4.5 + Math.random() * 0.4).toFixed(1);

                container.innerHTML = salons.map(s => {
                    const rating = getMockRating();
                    return `
                        <div class="salon-card">
                            <div>
                                <div class="salon-card-header">
                                    <h3 class="salon-name">${s.salon_name}</h3>
                                    <div class="rating-badge">★ ${rating}</div>
                                </div>
                                <div class="salon-details">
                                    <div class="salon-address">📍 ${s.salon_address || 'Address not listed'}</div>
                                    ${s.salon_website ? `<a href="${s.salon_website}" target="_blank" class="salon-web-link">🔗 Visit Website</a>` : ''}
                                </div>
                            </div>
                            <button class="select-salon-btn" onclick="selectSalon('${s.id}', '${s.salon_name}')">Select Salon</button>
                        </div>
                    `;
                }).join('');
            }
        });

        function selectSalon(id, name) {
            // Save selected salon to localStorage to carry to booking page
            localStorage.setItem("stylepulse_selected_salon_id", id);
            localStorage.setItem("stylepulse_selected_salon_name", name);
            
            // Show select message and redirect to booking or dashboard
            const alertBox = document.getElementById("alert-box");
            const alertMessage = document.getElementById("alert-message");
            alertMessage.textContent = `Selected ${name}! Opening service menu...`;
            alertBox.className = "alert-box show success";
            
            setTimeout(() => {
                window.location.href = "salon-services.html";
            }, 1500);
        }
    </script>
</body>
</html>

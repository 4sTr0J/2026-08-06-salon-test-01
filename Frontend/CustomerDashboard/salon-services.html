<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StylePulse - Salon Service Menu</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Shared StylePulse Styles -->
    <link rel="stylesheet" href="../index.css?v=60">
    
    <style>
        html,
        body {
            height: auto !important;
            min-height: 100vh !important;
            overflow-y: auto !important;
            background: #080605 !important;
        }

        .services-page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 110px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-inline: 2rem;
            padding-bottom: 4rem;
            z-index: 10;
            position: relative;
            box-sizing: border-box;
        }

        .services-header {
            margin-bottom: 2.5rem;
            animation: slideUp 0.8s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255, 184, 43, 0.2);
            padding-bottom: 1.5rem;
        }

        .services-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .services-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .btn-back-salons {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 184, 43, 0.3);
            color: #ffffff;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back-salons:hover {
            background: rgba(255, 184, 43, 0.1);
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255, 184, 43, 0.2);
        }

        /* Services Grid - Multi-column row-wise layout */
        .services-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
            gap: 1.5rem !important;
            width: 100% !important;
            animation: slideUp 1s ease-out;
            margin-bottom: 4rem;
            box-sizing: border-box;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.75rem;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            width: 100%;
            box-sizing: border-box;
        }

        .service-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--gold-glow);
            border-color: #ffcc00;
        }

        .service-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.6rem;
            text-transform: capitalize;
        }

        .service-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .meta-tag {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-duration {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .service-price-block {
            margin-bottom: 1.5rem;
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .price-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        .book-service-btn {
            background: var(--accent-gradient);
            color: #000000;
            border: none;
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .book-service-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .empty-services {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px dashed rgba(255, 184, 43, 0.3);
            border-radius: 16px;
            color: var(--text-secondary);
            font-style: italic;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ambient Glow Backgrounds */
        .auth-bg-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffaa00 0%, transparent 70%);
            top: -150px;
            left: -150px;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="auth-bg-ambient">
        <div class="bg-glow-orb orb-1"></div>
        <div class="bg-glow-orb orb-2"></div>
    </div>

    <!-- Fixed Top Navigation Header -->
    <header class="navbar" id="main-header" style="background: rgba(8, 6, 5, 0.95); border-bottom: 1px solid rgba(255, 184, 43, 0.3); position: fixed; width: 100%;">
        <div class="nav-left">
            <a href="../index.html" class="nav-logo">
                <img src="../component/logo.png" alt="StylePulse Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="salons.html" class="nav-link">EXPLORE SALONS</a>
                <a href="dashboard.html" class="nav-link">MY DASHBOARD</a>
                <a href="rewards.html" class="nav-link" style="color: #ffcc00; font-weight: 700;">MY REWARDS</a>
            </nav>
        </div>
        <div class="nav-right">
            <div style="color: var(--text-secondary); margin-right: 1.5rem; font-size: 0.9rem;" id="user-email-display"></div>
            <button id="logout-btn" class="nav-login" style="border: none; pointer-events: auto; cursor: pointer; background: transparent; font-family: 'Poppins', sans-serif; color: #ffffff;">LOG OUT</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="services-page-wrapper">
        <!-- Luxury Hero Banner Card -->
        <div class="salon-hero-card" id="salon-hero-banner" style="background: linear-gradient(180deg, rgba(8,6,5,0.4) 0%, rgba(8,6,5,0.95) 100%), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80') center/cover; border: 1px solid rgba(255, 184, 43, 0.25); border-radius: 20px; padding: 3rem; margin-bottom: 3rem; display: flex; flex-direction: column; justify-content: flex-end; min-height: 250px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden; animation: slideUp 0.8s ease-out; width: 100%; box-sizing: border-box;">
            <div style="z-index: 2;">
                <h1 class="services-title" id="salon-name-title" style="font-family: 'Outfit', sans-serif; font-size: 3.2rem; font-weight: 700; margin-bottom: 0.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Salon Name</h1>
                <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
                    <p class="services-subtitle" id="salon-subtitle-address" style="margin: 0; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; text-shadow: 0 1px 5px rgba(0,0,0,0.5);">📍 Location not listed</p>
                    <a id="salon-link-website" href="#" target="_blank" style="display: none; align-items: center; gap: 6px; color: #ffcc00; text-decoration: none; font-size: 1rem; font-weight: 600; text-shadow: 0 1px 5px rgba(0,0,0,0.5);">🔗 Visit Website</a>
                </div>
            </div>
            <a href="salons.html" class="btn-back-salons" style="position: absolute; top: 2rem; right: 2rem; background: rgba(0,0,0,0.6); text-decoration: none;">← Back to Salons</a>
        </div>

        <div style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; animation: slideUp 0.9s ease-out; width: 100%;">
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 600; color: #ffffff; margin: 0;">Available Services</h2>
            <div style="font-size: 0.9rem; color: var(--text-secondary);">Select a service below to book an appointment</div>
        </div>

        <!-- Grid of Services (Row-Wise Layout) -->
        <div class="services-grid" id="services-list-container">
            <div class="empty-services">Loading available services...</div>
        </div>
    </div>

    <!-- Alert Box Notification -->
    <div id="alert-box" class="alert-box">
        <div class="alert-content">
            <span id="alert-icon" class="alert-icon"></span>
            <span id="alert-message" class="alert-message"></span>
        </div>
    </div>
    
    <style>
        .alert-box {
            position: fixed; top: 20px; right: -400px;
            background: rgba(12, 11, 8, 0.95); border-left: 4px solid;
            padding: 16px 24px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999; backdrop-filter: blur(10px);
            display: flex; align-items: center;
        }
        .alert-box.show { right: 20px; }
        .alert-box.success { border-color: #2ecc71; }
        .alert-box.error { border-color: #e74c3c; }
        .alert-content { display: flex; align-items: center; gap: 12px; }
        .alert-message { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 500; color: #fff; }
    </style>

    <!-- Frontend logic to fetch and display services -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("stylepulse_token");
            const userString = localStorage.getItem("stylepulse_user");
            let user = null;

            if (userString) {
                try { user = JSON.parse(userString); } catch (e) { user = null; }
            }

            if (!token || !user) {
                window.location.href = "../login.html";
                return;
            }

            // Get selected salon details from localStorage
            const salonId = localStorage.getItem("stylepulse_selected_salon_id");
            const salonName = localStorage.getItem("stylepulse_selected_salon_name") || "Salon Service Menu";
            const salonAddress = localStorage.getItem("stylepulse_selected_salon_address") || "Address not listed";
            const salonWebsite = localStorage.getItem("stylepulse_selected_salon_website");
            const salonImage = localStorage.getItem("stylepulse_selected_salon_image");

            if (!salonId) {
                window.location.href = "salons.html";
                return;
            }

            // Set Header details
            document.getElementById("salon-name-title").textContent = salonName;
            document.getElementById("salon-subtitle-address").textContent = `📍 ${salonAddress}`;
            document.getElementById("user-email-display").textContent = user.email.toUpperCase();

            // Set Hero Card background
            const heroBanner = document.getElementById("salon-hero-banner");
            if (heroBanner && salonImage) {
                heroBanner.style.background = `linear-gradient(180deg, rgba(8,6,5,0.4) 0%, rgba(8,6,5,0.95) 100%), url('${salonImage}') center/cover`;
            }

            // Set Website Link
            const webLink = document.getElementById("salon-link-website");
            if (webLink && salonWebsite) {
                webLink.href = salonWebsite;
                webLink.style.display = "inline-flex";
            }

            // Logout
            const logoutBtn = document.getElementById("logout-btn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem("stylepulse_token");
                    localStorage.removeItem("stylepulse_user");
                    window.location.href = "../login.html";
                });
            }

            // Fetch Services from Backend
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const API_ROOT = (window.STYLEPULSE_API_BASE || (isLocal ? 'http://localhost:5001' : 'https://backend-production-8cd3.up.railway.app')).replace(/\/$/, '');
            const container = document.getElementById("services-list-container");
            try {
                const res = await fetch(`${API_ROOT}/api/auth/salons/${salonId}/services`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success && data.services) {
                    renderServices(data.services);
                } else {
                    container.innerHTML = `<div class="empty-services">Failed to load service menu.</div>`;
                }
            } catch (err) {
                console.error("Services load error:", err);
                container.innerHTML = `<div class="empty-services">Connection error. Please try again later.</div>`;
            }

            function renderServices(services) {
                if (services.length === 0) {
                    container.innerHTML = `<div class="empty-services">This salon hasn't added any services yet. Please check back later!</div>`;
                    return;
                }

                container.innerHTML = services.map(s => {
                    const categoryTag = (s.category && s.category !== 'General')
                        ? `<span class="meta-tag" style="background: rgba(255, 204, 0, 0.12); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.3);">🏷️ ${s.category}</span>`
                        : '';
                    const safeName = (s.name || '').replace(/'/g, "\\'");

                    return `
                        <div class="service-card">
                            <div>
                                <h3 class="service-name">${s.name}</h3>
                                <div class="service-meta">
                                    <span class="meta-tag tag-duration">⏱ ${s.duration} Mins</span>
                                    ${categoryTag}
                                </div>
                                <div class="service-price-block">
                                    <div class="price-label">Price (LKR)</div>
                                    <div class="price-value">Rs. ${parseFloat(s.price).toLocaleString()}</div>
                                </div>
                            </div>
                            <button class="book-service-btn" onclick="bookAppointment('${safeName}', '${s.price}')">Book Service</button>
                        </div>
                    `;
                }).join('');
            }
        });

        // ── FRESHA-STYLE BOOKING FLOW ─────────────────────────────────────
        const isLocalBooking = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API = (window.STYLEPULSE_API_BASE || (isLocalBooking ? 'http://localhost:5001' : 'https://backend-production-8cd3.up.railway.app')).replace(/\/$/, '');
        // All possible slots (9am–7pm, every 30 min)
        const ALL_SLOTS = [
            "09:00","09:30","10:00","10:30","11:00","11:30",
            "12:00","12:30","13:00","13:30","14:00","14:30",
            "15:00","15:30","16:00","16:30","17:00","17:30",
            "18:00","18:30"
        ];

        function fmt12(t) {
            const [h, m] = t.split(":").map(Number);
            const ampm = h < 12 ? "AM" : "PM";
            const h12 = h % 12 || 12;
            return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
        }

        function buildDateCarousel() {
            const today = new Date();
            const days = [];
            for (let i = 0; i < 14; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                days.push(d);
            }
            return days;
        }

        function isoDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        async function loadAvailableSlots(dateStr) {
            try {
                const salonId = localStorage.getItem("stylepulse_selected_salon_id") || "";
                const res = await fetch(`${API}/api/appointments/available?date=${dateStr}&salonId=${salonId}`);
                if (!res.ok) return { available: ALL_SLOTS, operating: ALL_SLOTS };
                const data = await res.json();
                return {
                    available: data.availableSlots || ALL_SLOTS,
                    operating: data.operatingSlots || data.availableSlots || ALL_SLOTS
                };
            } catch {
                return { available: ALL_SLOTS, operating: ALL_SLOTS };
            }
        }

        async function bookAppointment(serviceName, price) {
            const salonId = localStorage.getItem("stylepulse_selected_salon_id");
            if (!salonId) return;

            const basePrice = parseFloat(price) || 0;

            // ── Fetch active cancellation policy for this salon ──
            let policyData = {
                type: 'flexible',
                windowHours: 24,
                refundPct: 100,
                lateRefundPct: 50,
                description: 'Full refund if cancelled at least 24 hours in advance.'
            };

            try {
                const polRes = await fetch(`${API}/api/cancellation-policy/active?salon_id=${salonId}`);
                if (polRes.ok) {
                    const json = await polRes.json();
                    if (json && json.policy) {
                        const p = json.policy;
                        const pType = (p.policy_type || 'flexible').toLowerCase();
                        const win = Number(p.cancellation_window_hours) || 24;
                        const ref = p.refund_percentage !== undefined ? Number(p.refund_percentage) : 100;
                        const lateRef = Math.max(0, ref - 50);
                        policyData = {
                            type: pType,
                            windowHours: win,
                            refundPct: ref,
                            lateRefundPct: lateRef,
                            description: p.description || ''
                        };
                    }
                }
            } catch (err) {
                console.warn('Could not fetch salon cancellation policy:', err);
            }

            const fullRefundAmount = ((basePrice * policyData.refundPct) / 100).toFixed(0);
            const lateRefundAmount = ((basePrice * policyData.lateRefundPct) / 100).toFixed(0);

            // ── Build modal skeleton ──
            const modalId = "temp-booking-modal";
            let oldModal = document.getElementById(modalId);
            if (oldModal) oldModal.remove();

            const modal = document.createElement("div");
            modal.id = modalId;
            Object.assign(modal.style, {
                position:"fixed", inset:"0", background:"rgba(0,0,0,0.88)",
                display:"flex", alignItems:"center", justifyContent:"center",
                zIndex:"10000", backdropFilter:"blur(10px)"
            });

            modal.innerHTML = `
            <style>
            #sp-book-panel{background:#13100a;border:1px solid rgba(255,184,43,.45);border-radius:20px;width:92%;max-width:480px;padding:0;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.7)}
            #sp-book-header{background:linear-gradient(135deg,#1a1300,#261900);padding:20px 24px;border-bottom:1px solid rgba(255,184,43,.2)}
            #sp-book-header h3{margin:0;font-size:1.35rem;color:#ffcc00}
            #sp-book-header p{margin:4px 0 0;font-size:.85rem;color:rgba(255,200,100,.7)}
            #sp-book-body{padding:18px 24px;max-height:72vh;overflow-y:auto}
            .sp-section-label{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:#999;text-transform:uppercase;margin-bottom:8px}
            /* Date carousel */
            #sp-date-carousel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
            #sp-date-carousel::-webkit-scrollbar{display:none}
            .sp-date-chip{min-width:56px;padding:9px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;text-align:center;transition:.2s;flex-shrink:0}
            .sp-date-chip:hover{border-color:rgba(255,184,43,.5);background:rgba(255,184,43,.08)}
            .sp-date-chip.active{border-color:#ffcc00;background:rgba(255,184,43,.15);box-shadow:0 0 12px rgba(255,184,43,.2)}
            .sp-date-chip .dow{font-size:.65rem;color:#888;font-weight:600;text-transform:uppercase}
            .sp-date-chip .dom{font-size:1.25rem;font-weight:700;color:#fff;line-height:1.1}
            .sp-date-chip .mon{font-size:.65rem;color:#888}
            /* Slot grid */
            #sp-slots-container{margin-top:14px}
            #sp-slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
            .sp-slot{padding:10px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);cursor:pointer;text-align:center;font-size:.82rem;font-weight:600;transition:.2s}
            .sp-slot:hover{border-color:rgba(255,184,43,.5);background:rgba(255,184,43,.08)}
            .sp-slot.active{border-color:#ffcc00;background:rgba(255,184,43,.18);color:#ffcc00}
            .sp-slot.booked{opacity:.3;cursor:not-allowed;text-decoration:line-through;pointer-events:none}
            #sp-slots-loading{text-align:center;padding:16px;color:#888;font-size:.85rem}
            /* Footer */
            #sp-book-footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)}
            #sp-cancel-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.88rem}
            #sp-confirm-btn{background:linear-gradient(135deg,#ffc845,#e5a93b);border:none;color:#000;padding:9px 22px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.88rem;opacity:.4;pointer-events:none;transition:.2s}
            #sp-confirm-btn.ready{opacity:1;pointer-events:all}
            /* Error toast */
            #sp-error-toast{display:none;background:rgba(220,40,40,.15);border:1px solid rgba(220,40,40,.4);color:#ff8080;border-radius:8px;padding:10px 14px;font-size:.82rem;margin-top:12px;text-align:left}
            </style>
            <div id="sp-book-panel">
              <div id="sp-book-header">
                <h3>📅 Book Appointment</h3>
                <p>${serviceName} &nbsp;·&nbsp; Rs. ${basePrice.toLocaleString()}</p>
              </div>
              <div id="sp-book-body">
                <div style="background: rgba(255, 184, 43, 0.08); border: 1px solid rgba(255, 184, 43, 0.25); border-radius: 10px; padding: 8px 12px; font-size: 0.78rem; color: #ffcc00; margin-bottom: 14px; line-height: 1.35;">
                  🛡️ <strong>StylePulse Buffer Guarantee:</strong> Each booking includes a dedicated <strong>30-minute buffer period</strong> after your service.
                </div>
                <div class="sp-section-label">1. Select a Date</div>
                <div id="sp-date-carousel"></div>
                <div id="sp-slots-container" style="display:none">
                  <div class="sp-section-label" style="margin-top:14px">2. Pick a Time</div>
                  <div id="sp-slots-grid"></div>
                </div>

                <!-- Cancellation Policy & Refund Details -->
                <div style="margin-top: 16px; background: rgba(255, 170, 0, 0.05); border: 1px solid rgba(255, 204, 102, 0.25); border-radius: 12px; padding: 12px 14px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                      <span style="font-size: 0.95rem;">📋</span>
                      <span style="font-size: 0.76rem; font-weight: 700; color: #ffcc00; text-transform: uppercase; letter-spacing: 0.06em;">Cancellation &amp; Refund Policy</span>
                    </div>
                    <span style="font-size: 0.68rem; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; background: ${policyData.refundPct === 100 ? 'rgba(34, 197, 94, 0.15)' : 'rgba(245, 158, 11, 0.15)'}; border: 1px solid ${policyData.refundPct === 100 ? 'rgba(34, 197, 94, 0.35)' : 'rgba(245, 158, 11, 0.35)'}; color: ${policyData.refundPct === 100 ? '#4ade80' : '#fbbf24'};">
                      ${policyData.type} (${policyData.windowHours}h)
                    </span>
                  </div>

                  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 0.76rem; color: #ddd;">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; background: rgba(255, 255, 255, 0.03); border-radius: 6px;">
                      <span>⏱️ <strong>${policyData.windowHours}+ Hours in Advance:</strong></span>
                      <span style="font-weight: 700; color: #4ade80;">${policyData.refundPct}% Refund ${basePrice > 0 ? `(Rs. ${Number(fullRefundAmount).toLocaleString()})` : ''}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 9px; background: rgba(255, 255, 255, 0.03); border-radius: 6px;">
                      <span>⏳ <strong>Within ${policyData.windowHours} Hours Notice:</strong></span>
                      <span style="font-weight: 700; color: ${policyData.lateRefundPct > 0 ? '#fbbf24' : '#f87171'};">
                        ${policyData.lateRefundPct > 0 ? `${policyData.lateRefundPct}% Partial Refund ${basePrice > 0 ? `(Rs. ${Number(lateRefundAmount).toLocaleString()})` : ''}` : 'No Monetary Refund'}
                      </span>
                    </div>
                  </div>

                  <div style="margin-top: 7px; font-size: 0.70rem; color: rgba(255, 255, 255, 0.55); line-height: 1.35;">
                    💡 Refunds are processed directly to your bank account upon cancellation request.
                  </div>
                </div>

                <div style="margin-top: 14px; padding: 12px 14px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,184,43,0.3); border-radius: 10px; font-size: 0.8rem; color: #ccc;">
                  💳 <strong>Payment Notice:</strong> Full payment via Card is required. You can redeem your Style Points for discounts on the next payment page.
                </div>

                <div id="sp-error-toast"></div>
              </div>
              <div id="sp-book-footer">
                <button id="sp-cancel-btn">Cancel</button>
                <button id="sp-confirm-btn">Proceed to Payment →</button>
              </div>
            </div>`;

            document.body.appendChild(modal);

            // ── State ──
            let selectedDate = null;
            let selectedSlot = null;

            // ── Build date carousel ──
            const carousel = document.getElementById("sp-date-carousel");
            const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
            const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

            buildDateCarousel().forEach(d => {
                const chip = document.createElement("div");
                chip.className = "sp-date-chip";
                chip.dataset.iso = isoDate(d);
                chip.innerHTML = `<div class="dow">${DAYS[d.getDay()]}</div><div class="dom">${d.getDate()}</div><div class="mon">${MONTHS[d.getMonth()]}</div>`;
                chip.addEventListener("click", () => selectDate(chip, isoDate(d)));
                carousel.appendChild(chip);
            });

            async function selectDate(chip, dateStr) {
                carousel.querySelectorAll(".sp-date-chip").forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                selectedDate = dateStr;
                selectedSlot = null;
                document.getElementById("sp-confirm-btn").classList.remove("ready");

                const slotsContainer = document.getElementById("sp-slots-container");
                const grid = document.getElementById("sp-slots-grid");
                slotsContainer.style.display = "block";
                grid.innerHTML = `<div id="sp-slots-loading" style="grid-column:1/-1">⏳ Loading available slots…</div>`;

                const result = await loadAvailableSlots(dateStr);
                const available = result.available;
                const operating = result.operating;

                grid.innerHTML = "";
                if (operating.length === 0) {
                    grid.innerHTML = `<p style="color:#888;font-size:.85rem;grid-column:1/-1">No slots configured for this day.</p>`;
                    return;
                }

                const now = new Date();
                const localYear = now.getFullYear();
                const localMonth = String(now.getMonth() + 1).padStart(2, '0');
                const localDay = String(now.getDate()).padStart(2, '0');
                const todayIso = `${localYear}-${localMonth}-${localDay}`;
                const currentMinutesNow = now.getHours() * 60 + now.getMinutes();

                operating.forEach(slot => {
                    const [sh, sm] = slot.split(":").map(Number);
                    const slotMinutes = sh * 60 + sm;

                    const isPast = (dateStr < todayIso) || (dateStr === todayIso && slotMinutes <= currentMinutesNow);
                    const isAvailable = available.includes(slot) && !isPast;

                    const el = document.createElement("div");
                    el.className = "sp-slot" + (isAvailable ? "" : " booked");
                    el.textContent = fmt12(slot);
                    el.dataset.slot = slot;
                    if (isAvailable) {
                        el.addEventListener("click", () => selectSlot(el, slot));
                    } else if (isPast) {
                        el.title = "Time has passed";
                    }
                    grid.appendChild(el);
                });
            }

            function selectSlot(el, slot) {
                document.querySelectorAll(".sp-slot").forEach(s => s.classList.remove("active"));
                el.classList.add("active");
                selectedSlot = slot;
                document.getElementById("sp-confirm-btn").classList.add("ready");
                hideError();
            }

            function showError(msg) {
                const t = document.getElementById("sp-error-toast");
                t.style.display = "block";
                t.textContent = "⚠️ " + msg;
            }
            function hideError() {
                document.getElementById("sp-error-toast").style.display = "none";
            }

            // ── Cancel ──
            document.getElementById("sp-cancel-btn").addEventListener("click", () => modal.remove());
            modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });

            // ── Proceed to Payment ──
            const confirmBtn = document.getElementById("sp-confirm-btn");
            confirmBtn.addEventListener("click", (e) => {
                e.preventDefault();
                if (!selectedDate) {
                    showError("Please pick a date first.");
                    return;
                }
                if (!selectedSlot) {
                    showError("Please pick a time slot first.");
                    return;
                }

                const token = localStorage.getItem("stylepulse_token");
                if (!token) {
                    window.location.href = "../login.html";
                    return;
                }

                const currentSalonName = localStorage.getItem("stylepulse_selected_salon_name") || "Exclusive Salon";

                // Save selected appointment details to sessionStorage
                const pendingBooking = {
                    salonId: salonId,
                    salonName: currentSalonName,
                    serviceName: serviceName,
                    date: selectedDate,
                    time: selectedSlot,
                    price: price
                };
                sessionStorage.setItem("pending_booking", JSON.stringify(pendingBooking));
                console.log("Redirecting with booking details:", pendingBooking);

                // Redirect to dedicated payment checkout page
                window.location.href = "payment.html";
            });
        }
    </script>
    <script src="../chatWidget.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — StylePulse Luxury Salon Platform</title>
    <meta name="description" content="Log in to your StylePulse account for real-time salon bookings and appointment management.">

    <!-- Premium Google Fonts: Poppins & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css?v=1.0">
</head>

<body class="auth-page">

    <!-- Background Ambient Glow & Floating FX -->
    <div class="auth-bg-ambient">
        <div class="bg-glow-orb orb-1"></div>
        <div class="bg-glow-orb orb-2"></div>
        <div class="bg-grid-overlay"></div>
    </div>

    <!-- Back to Main Website Header Link -->
    <div class="top-nav-bar">
        <a href="index.html" class="back-home-link">
            <span class="back-arrow">←</span> BACK TO STYLEPULSE
        </a>
    </div>

    <!-- Main Auth Section -->
    <main class="auth-container">
        <div class="auth-card-wrapper">

            <!-- Cyber HUD SVG Vector Frame -->
            <svg class="auth-hud-svg" viewBox="0 0 600 700" preserveAspectRatio="none">
                <defs>
                    <filter id="auth-gold-glow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="6" result="blur1" />
                        <feGaussianBlur stdDeviation="2" result="blur2" />
                        <feMerge>
                            <feMergeNode in="blur1" />
                            <feMergeNode in="blur2" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <linearGradient id="auth-beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff9900" stop-opacity="0.2" />
                        <stop offset="50%" stop-color="#ffcc00" stop-opacity="1" />
                        <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.3" />
                    </linearGradient>
                </defs>

                <!-- Base Dark Chamfer Path -->
                <path class="hud-base-path" d="M 0,45 L 20,25 L 20,15 L 45,0 L 250,0 L 265,15 L 335,15 L 350,0 L 555,0 L 580,15 L 580,25 L 600,45 L 600,655 L 580,675 L 580,685 L 555,700 L 350,700 L 335,685 L 265,685 L 250,700 L 45,700 L 20,685 L 20,675 L 0,655 Z" fill="#090605" stroke="#ffaa00" stroke-width="2" vector-effect="non-scaling-stroke" />

                <!-- Inner Accent Stroke -->
                <path d="M 5,48 L 23,30 L 23,20 L 48,5 L 248,5 L 263,18 L 337,18 L 352,5 L 552,5 L 577,20 L 577,30 L 595,48 L 595,652 L 577,670 L 577,680 L 552,695 L 352,695 L 337,682 L 263,682 L 248,695 L 48,695 L 23,680 L 23,670 L 5,652 Z" fill="none" stroke="rgba(255, 204, 102, 0.4)" stroke-width="1" vector-effect="non-scaling-stroke" />

                <!-- Cyber Bevel Corner Glows -->
                <path d="M 0,45 L 20,25 L 20,15 L 45,0" fill="none" stroke="#ffcc00" stroke-width="2.5" filter="url(#auth-gold-glow)" vector-effect="non-scaling-stroke" />
                <path d="M 555,0 L 580,15 L 580,25 L 600,45" fill="none" stroke="#ffcc00" stroke-width="2.5" filter="url(#auth-gold-glow)" vector-effect="non-scaling-stroke" />
                <path d="M 600,655 L 580,675 L 580,685 L 555,700" fill="none" stroke="#ffcc00" stroke-width="2.5" filter="url(#auth-gold-glow)" vector-effect="non-scaling-stroke" />
                <path d="M 45,700 L 20,685 L 20,675 L 0,655" fill="none" stroke="#ffcc00" stroke-width="2.5" filter="url(#auth-gold-glow)" vector-effect="non-scaling-stroke" />

                <!-- Moving Laser Beam -->
                <path class="hud-live-beam" d="M 0,45 L 20,25 L 20,15 L 45,0 L 250,0 L 265,15 L 335,15 L 350,0 L 555,0 L 580,15 L 580,25 L 600,45 L 600,655 L 580,675 L 580,685 L 555,700 L 350,700 L 335,685 L 265,685 L 250,700 L 45,700 L 20,685 L 20,675 L 0,655 Z" fill="none" stroke="url(#auth-beam-grad)" stroke-width="2.5" filter="url(#auth-gold-glow)" vector-effect="non-scaling-stroke" />
            </svg>

            <!-- Card Inner Form Content -->
            <div class="auth-card-body">
                
                <!-- Logo & Header -->
                <div class="auth-header">
                    <a href="index.html" class="logo-link">
                        <img src="component/logo.png" alt="StylePulse Logo" class="auth-logo-img">
                    </a>
                    <h1 class="auth-title">WELCOME <span class="highlight-gold">BACK</span></h1>
                    <p class="auth-subtitle">Enter your credentials to access your luxury salon portal</p>
                </div>

                <!-- Role Selector Tabs -->
                <div class="role-selector-tabs">
                    <button type="button" class="role-tab active" data-role="client">
                        <span class="tab-icon">✨</span> Client
                    </button>
                    <button type="button" class="role-tab" data-role="owner">
                        <span class="tab-icon">👑</span> Salon Owner
                    </button>
                </div>

                <!-- Salon Owner Registration Link Prompt -->
                <div id="salon-owner-reg-notice" class="salon-owner-notice hidden">
                    <p>New Salon Owner? <a href="signup.html?type=owner" class="auth-link gold-link">Register Salon for Approval →</a></p>
                </div>

                <!-- Feedback Banner Message -->
                <div id="auth-alert" class="auth-alert hidden"></div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form" novalidate>
                    
                    <!-- Email / Username Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email or Phone Number</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="email" name="email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <div class="label-row">
                            <label for="password" class="form-label">Password</label>
                            <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
                        </div>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" id="toggle-password-btn" class="toggle-password" title="Toggle password visibility">
                                👁️
                            </button>
                        </div>
                    </div>

                    <!-- Options Row -->
                    <div class="form-options">
                        <label class="custom-checkbox-container">
                            <input type="checkbox" id="remember-me" name="remember">
                            <span class="checkmark"></span>
                            <span class="checkbox-label">Keep me logged in for 30 days</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="auth-submit-btn">
                        <span class="btn-text">LOG IN TO DASHBOARD</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="auth-divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">OR LOG IN WITH</span>
                    <span class="divider-line"></span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-login-grid">
                    <button type="button" class="social-btn google-btn">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
                            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.3-.7-.5-1.5-.5-2.3z"/>
                            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                        </svg>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn apple-btn">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="#ffffff">
                            <path d="M18.7 19.5c-.8 1.2-1.7 2.4-3 2.4-1.3 0-1.7-.8-3.2-.8-1.5 0-2 .8-3.2.8-1.3 0-2.3-1.3-3.1-2.4-1.7-2.5-3-7.1-1.2-10.2.9-1.5 2.5-2.5 4.3-2.5 1.3 0 2.6.9 3.4.9.8 0 2.4-1.1 4-1 .7 0 2.6.2 3.8 2-3.1 1.8-2.6 6.5.6 7.8-.6 1.4-1.5 2.9-2.4 4.2zM15.5 4.6c.7-.9 1.2-2.1 1-3.3-1 .1-2.3.7-3 1.5-.6.7-1.2 1.9-1 3.1 1.2.1 2.3-.5 3-1.3z"/>
                        </svg>
                        <span>Apple</span>
                    </button>
                </div>

                <!-- Footer Link to Signup -->
                <div class="auth-footer">
                    <p>Don't have an account yet? <a href="signup.html" class="auth-link">Sign Up Free</a></p>
                </div>
            </div>

        </div>
    </main>

    <script src="login.js?v=5.0"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StylePulse - Salon Service Menu</title>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Shared StylePulse Styles -->
    <link rel="stylesheet" href="index.css?v=60">
    
    <style>
        .services-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 120px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-inline: 2rem;
            z-index: 10;
            position: relative;
        }

        .services-header {
            margin-bottom: 3rem;
            animation: slideUp 0.8s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255, 184, 43, 0.2);
            padding-bottom: 1.5rem;
        }

        .services-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .services-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .btn-back-salons {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 184, 43, 0.3);
            color: #ffffff;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back-salons:hover {
            background: rgba(255, 184, 43, 0.1);
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255, 184, 43, 0.2);
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            animation: slideUp 1s ease-out;
            margin-bottom: 4rem;
        }

        .service-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 2rem;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
        }

        .service-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--gold-glow);
            border-color: #ffcc00;
        }

        .service-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.6rem;
        }

        .service-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .meta-tag {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-duration {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .service-price-block {
            margin-bottom: 1.5rem;
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .price-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
        }

        .book-service-btn {
            background: var(--accent-gradient);
            color: #000000;
            border: none;
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .book-service-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .empty-services {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px dashed rgba(255, 184, 43, 0.3);
            border-radius: 16px;
            color: var(--text-secondary);
            font-style: italic;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ambient Glow Backgrounds */
        .auth-bg-ambient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        .bg-glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffaa00 0%, transparent 70%);
            top: -150px;
            left: -150px;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
        }
    </style>
</head>
<body>

    <!-- Ambient background glows -->
    <div class="auth-bg-ambient">
        <div class="bg-glow-orb orb-1"></div>
        <div class="bg-glow-orb orb-2"></div>
    </div>

    <!-- Fixed Top Navigation Header -->
    <header class="navbar" id="main-header" style="background: rgba(8, 6, 5, 0.95); border-bottom: 1px solid rgba(255, 184, 43, 0.3); position: fixed; width: 100%;">
        <div class="nav-left">
            <a href="index.html" class="nav-logo">
                <img src="component/logo.png" alt="StylePulse Logo" class="logo-img">
            </a>
            <nav class="nav-links">
                <a href="salons.html" class="nav-link active">EXPLORE SALONS</a>
                <a href="dashboard.html" class="nav-link">MY DASHBOARD</a>
            </nav>
        </div>
        <div class="nav-right">
            <div style="color: var(--text-secondary); margin-right: 1.5rem; font-size: 0.9rem;" id="user-email-display"></div>
            <button id="logout-btn" class="nav-login" style="border: none; pointer-events: auto; cursor: pointer; background: transparent; font-family: 'Poppins', sans-serif; color: #ffffff;">LOG OUT</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="services-container">
        <div class="services-header">
            <div>
                <h1 class="services-title" id="salon-name-title">Salon Service Menu</h1>
                <p class="services-subtitle" id="salon-subtitle-address">📍 Loading salon location...</p>
            </div>
            <a href="salons.html" class="btn-back-salons">← Back to Salons</a>
        </div>

        <!-- Grid of Services -->
        <div class="services-grid" id="services-list-container">
            <div class="empty-services">Loading available services...</div>
        </div>
    </div>

    <!-- Alert Box Notification -->
    <div id="alert-box" class="alert-box">
        <div class="alert-content">
            <span id="alert-icon" class="alert-icon"></span>
            <span id="alert-message" class="alert-message"></span>
        </div>
    </div>
    
    <style>
        .alert-box {
            position: fixed; top: 20px; right: -400px;
            background: rgba(12, 11, 8, 0.95); border-left: 4px solid;
            padding: 16px 24px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999; backdrop-filter: blur(10px);
            display: flex; align-items: center;
        }
        .alert-box.show { right: 20px; }
        .alert-box.success { border-color: #2ecc71; }
        .alert-box.error { border-color: #e74c3c; }
        .alert-content { display: flex; align-items: center; gap: 12px; }
        .alert-message { font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 500; color: #fff; }
    </style>

    <!-- Frontend logic to fetch and display services -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("stylepulse_token");
            const userString = localStorage.getItem("stylepulse_user");
            let user = null;

            if (userString) {
                try { user = JSON.parse(userString); } catch (e) { user = null; }
            }

            if (!token || !user) {
                window.location.href = "login.html";
                return;
            }

            // Get selected salon from localStorage
            const salonId = localStorage.getItem("stylepulse_selected_salon_id");
            const salonName = localStorage.getItem("stylepulse_selected_salon_name") || "Salon Service Menu";

            if (!salonId) {
                window.location.href = "salons.html";
                return;
            }

            // Set titles
            document.getElementById("salon-name-title").innerHTML = `Menu of <span class="highlight-gold" style="background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${salonName}</span>`;
            document.getElementById("user-email-display").textContent = user.email.toUpperCase();

            // Logout
            const logoutBtn = document.getElementById("logout-btn");
            if (logoutBtn) {
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem("stylepulse_token");
                    localStorage.removeItem("stylepulse_user");
                    window.location.href = "login.html";
                });
            }

            // Fetch Services from Backend
            const container = document.getElementById("services-list-container");
            try {
                const res = await fetch(`http://localhost:5000/api/auth/salons/${salonId}/services`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success && data.services) {
                    renderServices(data.services);
                } else {
                    container.innerHTML = `<div class="empty-services">Failed to load service menu.</div>`;
                }
            } catch (err) {
                console.error("Services load error:", err);
                container.innerHTML = `<div class="empty-services">Connection error. Please try again later.</div>`;
            }

            function renderServices(services) {
                if (services.length === 0) {
                    container.innerHTML = `<div class="empty-services">This salon hasn't added any services yet. Please check back later!</div>`;
                    return;
                }

                container.innerHTML = services.map(s => `
                    <div class="service-card">
                        <div>
                            <h3 class="service-name">${s.name}</h3>
                            <div class="service-meta">
                                <span class="meta-tag tag-duration">⏱ ${s.duration} Mins</span>
                            </div>
                            <div class="service-price-block">
                                <div class="price-label">Price (LKR)</div>
                                <div class="price-value">Rs. ${parseFloat(s.price).toLocaleString()}</div>
                            </div>
                        </div>
                        <button class="book-service-btn" onclick="bookAppointment('${s.name}', '${s.price}')">Book Service</button>
                    </div>
                `).join('');
            }
        });

        function bookAppointment(serviceName, price) {
            // Mock a successful booking
            const alertBox = document.getElementById("alert-box");
            const alertMessage = document.getElementById("alert-message");
            alertMessage.textContent = `✓ Success: Booked ${serviceName} (Rs. ${parseFloat(price).toLocaleString()})!`;
            alertBox.className = "alert-box show success";
            
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 2000);
        }
    </script>
</body>
</html>
